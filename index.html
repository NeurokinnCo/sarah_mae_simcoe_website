<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/sarah_mae_simcoe_website/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sarah Mae Simcoe is a Clinical Psychologist, neurodiversity-affirming practitioner, PsyBA Board-approved Supervisor, and Clinic Director at Neurokin & Co. based in Brisbane, Australia.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sarah Mae Simcoe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sarah Mae Simcoe | Clinical Psychologist</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Premium loading screen styles matching site brand colors */
    body {
      background-color: #FBFBF9;
      margin: 0;
      padding: 0;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #FBFBF9;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.4s ease-out;
    }
    .spinner-container {
      position: relative;
      width: 70px;
      height: 70px;
      margin-bottom: 24px;
    }
    .spinner-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(77, 57, 254, 0.12);
      border-top: 4px solid #4D39FE;
      border-radius: 50%;
      animation: spin-clockwise 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    .spinner-inner {
      position: absolute;
      top: 10px;
      left: 10px;
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      border: 3px solid rgba(253, 168, 70, 0.15);
      border-bottom: 3px solid #FDA846;
      border-radius: 50%;
      animation: spin-counter-clockwise 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    .loading-text {
      color: #2B2D2F;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.85;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-counter-clockwise {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.95; }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner-container">
      <div class="spinner-outer"></div>
      <div class="spinner-inner"></div>
    </div>
    <div class="loading-text">Loading...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
